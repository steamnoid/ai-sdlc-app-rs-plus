name: gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      # The history, not one commit. A gate that reads the history is a gate that cannot see
      # what it judges when the checkout is shallow, and a gate that cannot see what it
      # judges reports a pass it did not earn. Fetching everything costs seconds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # This job hands no stored credential to any step, and the gate below says so in a
      # sentence rather than in a setting. `secrets.` is the rule and the dot is part of it,
      # so that a sentence saying the job needs none is not itself a violation of the rule it
      # is recording.
      #
      # One command, so that this job and a person cannot disagree about what the gate is.
      - name: The gate
        run: ./scripts/gate
